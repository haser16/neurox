<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email подтверждён — Neurox</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #18181b;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color: #f4f4f5; padding: 40px 20px; min-height: 100vh;">
    <tr>
        <td align="center" valign="middle">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="
                       max-width: 500px;
                       background-color: #ffffff;
                       border-radius: 12px;
                       overflow: hidden;
                   ">

                <!-- Header -->
                <tr>
                    <td style="padding: 32px 40px 20px; text-align: center;">
                        <h1 style="
                            margin: 0;
                            font-size: 28px;
                            color: #18181b;
                        ">
                            Neurox
                        </h1>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="
                        padding: 30px 40px 40px;
                        text-align: center;
                    ">

                        <div style="
                            width: 64px;
                            height: 64px;
                            margin: 0 auto 24px;
                            border-radius: 50%;
                            background-color: #f4f4f5;
                            line-height: 64px;
                            font-size: 32px;
                        ">
                            ✓
                        </div>

                        <h2 style="
                            margin: 0 0 16px;
                            font-size: 24px;
                            line-height: 1.3;
                        ">
                            Email успешно подтверждён
                        </h2>

                        <p style="
                            margin: 0;
                            font-size: 16px;
                            line-height: 1.6;
                            color: #71717a;
                        ">
                            Спасибо! Ваш адрес электронной почты успешно подтверждён.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
                        padding: 20px 40px;
                        background-color: #fafafa;
                        text-align: center;
                    ">
                        <p style="
                            margin: 0;
                            font-size: 12px;
                            color: #a1a1aa;
                        ">
                            © 2026 Neurox. Все права защищены.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
