services:
  neurox-postgres:
    image: postgres:18.1-bookworm
    container_name: neurox-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  neurox-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: neurox-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:neurox-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    image: minio/minio
    container_name: neurox-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: neurox-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${PUBLISHER_USER}
      RABBITMQ_DEFAULT_PASS: ${PUBLISHER_PASSWORD}